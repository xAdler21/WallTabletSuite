[workspace]
resolver = "3"
members = ["crates/common", "crates/server", "crates/kiosk", "crates/camera"]
# kiosk and camera need GTK/WebKit/GStreamer development files (Linux only); server and common build anywhere
default-members = ["crates/common", "crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.93" # Ubuntu 26.04's rustc: keeps cargo from locking dependencies that need a newer one
license = "UNLICENSED"
publish = false

[workspace.dependencies]
wts-common = { path = "crates/common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
